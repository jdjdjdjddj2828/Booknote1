<style id="lkStyle">
:root{--lk-bg:#ffffff;--lk-ink:#1c1c1e;--lk-muted:#707078;--lk-field:#f1f1f4;--lk-line:#dcdce2;--lk-accent:#2a7be4;--lk-danger:#d63b30}
@media (prefers-color-scheme:dark){:root{--lk-bg:#111113;--lk-ink:#f2f2f6;--lk-muted:#9b9ba3;--lk-field:#2a2a2e;--lk-line:#36363c;--lk-accent:#4b94f3;--lk-danger:#ff6f64;color-scheme:dark}}
html,body{height:100%}
body{background:var(--lk-bg);color:var(--lk-ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif}
#lock{min-height:100%;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
#lock form{width:min(360px,100%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#lock .lk-logo{width:56px;height:70px;border-radius:5px 14px 14px 5px;background:var(--lk-accent);position:relative;box-shadow:inset 9px 0 0 rgb(0 0 0/.2),0 8px 22px rgb(0 0 0/.15);margin-bottom:6px}
#lock .lk-logo::after{content:"";position:absolute;left:17px;right:9px;top:18px;height:13px;border-radius:3px;background:#fffdf7}
#lock h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0}
#lock p{margin:0;color:var(--lk-muted);font-size:15px;line-height:1.45}
#lock input{width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid var(--lk-line);background:var(--lk-field);color:var(--lk-ink);font:inherit;font-size:19px;text-align:center;letter-spacing:.12em;padding:0 12px;margin-top:8px}
#lock input:focus{outline:none;border-color:var(--lk-accent)}
#lock button{width:100%;height:48px;border:0;border-radius:12px;background:var(--lk-accent);color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
#lock button:disabled{opacity:.6;cursor:default}
#lock button:focus-visible,#lock input:focus-visible{outline:2px solid var(--lk-accent);outline-offset:2px}
#lock .lk-err{color:var(--lk-danger);min-height:1.4em;font-size:14.5px}
</style>
<div id="lock">
  <form id="lkForm" hidden autocomplete="off">
    <div class="lk-logo" aria-hidden="true"></div>
    <h1>Листок</h1>
    <p>Приложение личное. Введите код доступа, который вам дали.</p>
    <label for="lkCode" style="position:absolute;left:-9999px">Код доступа</label>
    <input id="lkCode" name="code" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx" required>
    <button id="lkBtn" type="submit">Открыть</button>
    <p class="lk-err" id="lkErr" role="alert"></p>
    <p style="font-size:13px">Код нужно ввести один раз на этом устройстве.</p>
  </form>
</div>

  const KEY = 'listok-access-key';
  const $ = id => document.getElementById(id);
  const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => { let s = ''; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  async function derive(code) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(code)), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: fromB64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, base, 256));
  }
  async function decrypt(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(ENC.iv) }, key, fromB64(ENC.ct)));
  }
  function start(html) {
    const i = html.lastIndexOf('<script>'), j = html.lastIndexOf('</' + 'script>');
    $('lock').remove(); $('lkStyle').remove();
    document.body.insertAdjacentHTML('beforeend', html.slice(0, i));
    const s = document.createElement('script'); s.textContent = html.slice(i + 8, j); document.body.append(s);
  }
  function showForm(msg) { const f = $('lkForm'); f.hidden = false; if (msg) $('lkErr').textContent = msg; setTimeout(() => $('lkCode').focus(), 50); }
  if (!window.crypto || !crypto.subtle) { showForm('Откройте Листок по адресу https:// — иначе браузер не даёт расшифровать приложение.'); $('lkBtn').disabled = true; return; }
  $('lkForm').addEventListener('submit', async e => {
    e.preventDefault();
    const code = $('lkCode').value; if (!norm(code)) return;
    const btn = $('lkBtn'); btn.disabled = true; btn.textContent = 'Проверяем…'; $('lkErr').textContent = '';
    try {
      const raw = await derive(code); const html = await decrypt(raw);
      try { localStorage.setItem(KEY, toB64(raw)); } catch (er) {}
      start(html);
    } catch (er) { btn.disabled = false; btn.textContent = 'Открыть'; $('lkErr').textContent = 'Код не подходит. Проверьте буквы и цифры.'; $('lkCode').select(); }
  });
  (async () => {
    let k = null; try { k = localStorage.getItem(KEY); } catch (e) {}
    if (k) { try { start(await decrypt(fromB64(k))); return; } catch (e) { try { localStorage.removeItem(KEY); } catch (er) {} } }
    showForm();
  })();
})();
